  tag: QI-cap-nCopy
  content: 'The quantum capacity is the limit of the coherent information of n-copy
    uses of the channel.


    Formal statement: (Λ : CPTPMap d₁ d₂) : Λ.quantumCapacity =

    sSup { r : ℝ | ∃ n ρ, r = coherentInfo ρ (CPTPMap.piProd (fun (_ : Fin n) ↦ Λ))}

    '

- file: Physlib.ClassicalMechanics.Pendulum.SimplePendulum.PeriodFormula
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/Pendulum/SimplePendulum/PeriodFormula.lean#L140
  line: 140
  isInformalDef: false
  isInformalLemma: false
  isSemiFormalResult: false
  category: Classical Mechanics
  name: Physlib.ClassicalMechanics.Pendulum.SimplePendulum.PeriodFormula
  tag: 15468532183122286557
  content: "Prove that `periodFormula θ₀` is the period of the motion of the simple\
    \ pendulum released\n  from rest at the amplitude `θ₀`, for `0 < θ₀ < π`. Milestones\
    \ 1–2 — the uniqueness of the\n  smooth solutions of the equation of motion with\
    \ given initial data, and the time-reversal\n  symmetry of the equation of motion,\
    \ so that the motion released from rest is even in time and\n  its period is four\
    \ times the time of descent to the bottom — are formalized in a companion\n  module,\
    \ `SimplePendulum/Solution.lean` (`SimplePendulum.equationOfMotion_unique`,\n\
    \  `SimplePendulum.releasedFromRest_even`). The pointwise half of milestone 4,\
    \ the energy first\n  integral `θ̇² = (2g/ℓ)(cos θ - cos θ₀)`, is formalized in\
    \ a further companion module,\n  `SimplePendulum/ReleasedFromRest.lean`\n  (`SimplePendulum.sq_deriv_eq_of_isSolution_of_deriv_zero'`);\
    \ remaining:\n  (3) the quarter period as the first hitting time of `θ = 0` by\
    \ the motion released from rest,\n  which needs the monotonicity of the descent\
    \ from `θ₀` to `0` — not yet formalized — as an\n  input;\n  (4) turning the pointwise\
    \ energy first integral above into the quarter period as a definite\n  integral,\
    \ `√(ℓ/(2g)) ∫ θ in 0..θ₀, (cos θ - cos θ₀)^(-1/2)`, by a change of variables\
    \ from time\n  to the angle along the (monotonic) descent;\n  (5) the substitution\
    \ `sin (θ/2) = sin (θ₀/2) sin φ`, which transforms that integral into\n  `√(ℓ/g)\
    \ completeEllipticK (sin² (θ₀/2))`, including the justification that the resulting\n\
    \  improper integral, singular at `θ = θ₀`, converges;\n  (6) the assembly of\
    \ (1)–(5) into the theorem that the motion released from rest at `θ₀` is\n  periodic\
    \ with period `periodFormula θ₀`, which needs the motion to be defined for all\
    \ time —\n  only local existence (`SimplePendulum.exists_local_solution`) is formalized\
    \ so far.\n"

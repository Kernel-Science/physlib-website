    \ of the rotating frame.\n"
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L282
  line: 282
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.transport_law_for_momentum
  tag: LL32-transportP
  content: "For linear momentum, the relation between inertial and rotating derivatives\
    \ is\n  (dP/dt)_inertial = d'P/dt + Ω × P.\nSo, d'P/dt + Ω × P = F which is the\
    \ linear-momentum equation in the rotating frame.\n"
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L289
  line: 289
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.transport_law_for_angular_momentum
  tag: LL32-transportM
  content: "For angular momentum, the relation between inertial and rotating derivatives\
    \ is\n  (dM/dt)_inertial = d'M/dt + Ω × M,\nand with the rotational form of Newton's\
    \ law M_tot = (dM/dt)_inertial this yields\n  d'M/dt + Ω × M = K,\nthe angular-momentum\
    \ equation in the rotating frame.\n"
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L298
  line: 298
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.euler_equations
  tag: LL32-EQ
  content: 'When motion is described in body-fixed principal axes (I₁, I₂, I₃ diagonal),
    the equations of

    rotational motion (Euler’s equations) are:

    I₁ dω₁/dt + (I₃ − I₂) ω₂ ω₃ = M₁, with cyclic permutations.

    M is the external torque about the centre of mass.

    '
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L306
  line: 306
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.steady_rotation_conditions
  tag: LL32-SR
  content: 'A rigid body can perform steady (uniform) rotation about any principal
    axis if the torque about

    that axis vanishes. Stability depends on the ordering of principal moments.

    '
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L312
  line: 312
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.intermediate_axis_instability
  tag: LL32-IAI
  content: 'Rotations about the largest and smallest principal axes are stable under
    small perturbations;

    rotation about the intermediate axis is unstable (tennis-racket effect).

    '
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L318
  line: 318
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.reduction_to_two_body
  tag: LL32-RTB
  content: 'If a rigid body is confined to planar motion, its dynamics reduce to a
    two-dimensional problem:

    the inertia reduces to a scalar moment and rotation is described

    by a single angular velocity.

    '
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L325
  line: 325
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.rigid_body_work_and_power
  tag: LL32-WP
  content: 'The power delivered to a rigid body by forces is P = ∑ Fᵢ ⋅ vᵢ = F_tot
    ⋅ V + M ⋅ ω, where F_tot

    is total force, V the reference point velocity, and M the torque. Translational
    and rotational

    contributions separate.

    '
- file: Physlib.ClassicalMechanics.RigidBody.Basic
  githubLink: https://github.com/leanprover-community/physlib/blob/master/Physlib/ClassicalMechanics/RigidBody/Basic.lean#L332
  line: 332
  isInformalDef: false
  isInformalLemma: true
  isSemiFormalResult: false
  category: Classical Mechanics
  name: RigidBody.small_oscillations_about_equilibrium
  tag: LL32-SO
  content: 'Small oscillations about a stable equilibrium orientation are governed
    by linearised equations

    obtained by expanding energy to second order in angular displacements. Normal
    modes and

    frequencies depend on inertia and restoring torques.

    '

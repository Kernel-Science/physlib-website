  category: Cosmology
  name: Physlib.Cosmology.FLRW.MatterContent
  tag: 12542202776663159038
  content: "Relate `ContinuityEquation` to fluid dynamics: for the Hubble flow `u\
    \ = H x` on `Space 3`\n  with homogeneous `ρ` and `p`, one has `∇ ⬝ u = 3 H` and\
    \ `∇ ⬝ (ρ u) = 3 H ρ`, so that\n  `ContinuityEquation a ρ p c` is the fluid energy\
    \ equation\n  `∂ₜ ρ + ∇ ⬝ (ρ u) + (p / c²) ∇ ⬝ u = 0` (Newtonian cosmology with\
    \ pressure). This needs an\n  energy equation in `Physlib.FluidDynamics` first,\
    \ which currently has only the mass equation\n  `FluidFlow.ClassicalContinuityEquation`,\
    \ without the pressure work term.\n"

  category: Quantum Mechanics
  name: Physlib.QuantumMechanics.HilbertSpaces.FiniteTarget.Basic
  tag: 7758625237181002241
  content: "To match this with the results currently in the `QuantumInfo` part of\
    \ the library,\n  we should:\n  1. Define `FiniteHilbertSpace` as a structure\
    \ with a single entry `val`, this\n    should take as an input a finite and decidable\
    \ type `d`. Below this type is\n    taken as default to be `Fin n`.\n  2. On this\
    \ type we should then define the structure of an inner-product space, and a\n\
    \    Hilbert space.\n  3. We could then define the notation `\U0001D4D7[d]` to\
    \ denote the Hilbert space corresponding\n    to the type `d`.\n  4. The results\
    \ from `QuantumInfo/Finite/Braket.lean` can then be moved over\n    to Physlib,\
    \ and related to the definition of the Hilbert space here.\n  Optional. Maybe\
    \ it is worth moving these files to a directory called `States`, with\n  the idea\
    \ that it includes this definition of the Hilbert space, the\n  definition of\
    \ bras and kets, and the definition of mixed states. Maybe also\n  parts of `./ResourceTheory/FreeState`.\n"

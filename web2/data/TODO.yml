  name: BlockCode
  tag: QI-cc-block
  content: "A `BlockCode` is a `FixedLengthCode` that (1) maps symbols in discrete\
    \ blocks of fixed length,\n(2) the encoded alphabet `I` has a canonical injection\
    \ into `O`, and (3) has encoder and decoders\nthat are inverses of each other.\
    \ This is well-suited to describing noise and erasure channels. If\nthe channel\
    \ merely \"corrupts\" the data then this `O = I`; the erasure channel might for\
    \ instance\ntake `O = I ⊕ Unit` or `Option I`.\n\nWe define the behavior of a\
    \ block code to \"fail\" if the input is not a multiple of the block size,\nby\
    \ having it return an empty list.\n\nThe string encoder, the decoder and the two\
    \ length lemmas are left as `sorry` in the\nfield defaults.\n\nFormal type: (io\
    \ : I → O) extends FixedLengthCode A I O where\n  block_in : ℕ\n  block_out :\
    \ ℕ\n  block_enc : (Fin block_in → A) → (Fin block_out → I)\n  block_dec : (Fin\
    \ block_out → O) → (Fin block_in → A)\n  block_enc_dec_inv : ∀ as, block_dec (io\
    \ ∘ (block_enc as)) = as\n  enc_length na := if na % block_in != 0 then 0 else\
    \ (na / block_in) * block_out\n  dec_length no := if no % block_out != 0 then\
    \ 0 else (no / block_out) * block_in\n"

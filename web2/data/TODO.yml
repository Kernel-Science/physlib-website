  name: CPTPMap.coherentInfo_le_quantumCapacity
  tag: QI-cap-LSD
  content: "The LSD (Lloyd-Shor-Devetak) theorem: the quantum capacity is at least\
    \ as large the\nsingle-copy coherent information. The \"coherent information\"\
    \ is used in literature to refer to\nboth a function of state and a channel (`coherentInfo`),\
    \ or a function of just a channel. In\nthe latter case, the state is implicitly\
    \ maximized over. Here we use the former definition and\nstate that the lower\
    \ bound is true for all states.\n\nFormal statement: (Λ : CPTPMap d₁ d₂) (ρ :\
    \ MState d₁) :\n    coherentInfo ρ Λ ≤ Λ.quantumCapacity\n"

name: Generate references

on:
  schedule:
    # Weekly refresh, same cadence as api-map.yml — docs/references.bib and
    # the per-file citation comments it tracks change about as rarely as
    # API-map.md does. Offset five minutes from api-map.yml's run so the
    # two don't start in the same minute.
    - cron: "25 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# Two runs committing to the same branch would race on push.
concurrency:
  group: references
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Shared with the api-map and monthly-updates generators, which also
      # read this repo.
      - name: Cache physlib clone
        uses: actions/cache@v4
        with:
          path: web2/.cache/physlib.git
          key: physlib-clone-${{ github.run_id }}
          restore-keys: physlib-clone-

      - name: Run generator
        working-directory: web2
        run: node scripts/generate-references.js

      - name: Commit & push updated references
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web2/data/References.json
          if git diff --cached --quiet; then
            echo "No reference changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(references): auto-generated update"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The site deploys via Gabrielebattimelli/Physlib-Website (Vercel).
      # mirror-to-personal.yml keeps that mirror in sync, including for the
      # commit just pushed above: it also runs on workflow_run for this
      # workflow, which (unlike `push`) fires regardless of which token made
      # the commit it's mirroring.

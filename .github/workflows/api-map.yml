name: Generate API map

on:
  workflow_run:
    workflows: ["Archive site files and documentation from Physlib"]
    types: [completed]
    branches: [main]
  schedule:
    # Weekly fallback and monthly external source check.
    - cron: "20 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

# Two runs committing to the same branch would race on push.
concurrency:
  group: api-map
  cancel-in-progress: false

jobs:
  external-heads:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check on the first Monday of the month or a manual run
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || $(date -u +%-d) -le 7 ]]; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.check == 'true'
        with:
          persist-credentials: false
      - name: Report changes since the audited external revisions
        if: steps.due.outputs.check == 'true'
        working-directory: web2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-external-roadmap-heads.mjs >> "$GITHUB_STEP_SUMMARY"

  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A changed native revision requires tracing history and blame for every Lean file.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # The generator needs nothing beyond Node itself: it reads API-map.md
      # with its own parser and the Lean files with scripts/lean-decls.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Shared with the monthly-updates generator, which also reads this repo.
      - name: Cache physlib clone
        uses: actions/cache@v4
        with:
          path: web2/.cache/physlib.git
          key: physlib-clone-${{ github.run_id }}
          restore-keys: physlib-clone-

      - name: Generate API maps and roadmap
        working-directory: web2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-api-map.js
          node scripts/build-roadmap-native-folders.mjs
          python3 scripts/build-roadmap-native-declarations.py --repo .cache/physlib.git
          gzip -dc data/roadmap-audit/declarations.sqlite.gz > "$RUNNER_TEMP/roadmap.sqlite"
          python3 scripts/roadmap_placement.py --project-homes-only --db "$RUNNER_TEMP/roadmap.sqlite"
          python3 scripts/export-roadmap-declarations.py --complete --db "$RUNNER_TEMP/roadmap.sqlite"
          node scripts/build-verso-roadmap.mjs
          node --test scripts/roadmap.test.mjs scripts/roadmap-audited-data.test.mjs

      - name: Refresh native contributors when the Physlib revision changes
        working-directory: web2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(jq -er '.revision' data/RoadmapNativeFolders.json)
          if [[ -f public/roadmap-view/native-contributors.json ]] &&
             [[ $(jq -r '.revision' public/roadmap-view/native-contributors.json) == "$revision" ]]; then
            exit 0
          fi
          python3 scripts/build-roadmap-native-contributors.py --repo .cache/physlib.git

      - name: Refresh homepage wheels when Roadmap data changes
        working-directory: web2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/roadmap-view/roadmap-data.json; then exit 0; fi
          npm ci --no-audit --no-fund
          node scripts/download-docs.js
          node scripts/build-lean-search-index.mjs
          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3170 > "$RUNNER_TEMP/roadmap-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:3170/roadmap -o /dev/null
          node scripts/build-roadmap-previews.mjs http://127.0.0.1:3170

      - name: Commit & push updated API map
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web2/data/APIMap.json web2/data/RoadmapNativeFolders.json web2/data/RoadmapNativeDeclarations.json web2/public/roadmap-view/
          if git diff --cached --quiet; then
            echo "No API map changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(api-map): auto-generated update"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The site deploys via Gabrielebattimelli/Physlib-Website (Vercel).
      # mirror-to-personal.yml keeps that mirror in sync, including for the
      # commit just pushed above: it also runs on workflow_run for this
      # workflow, which (unlike `push`) fires regardless of which token made
      # the commit it's mirroring.

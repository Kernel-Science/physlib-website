name: Mirror to personal repo (Vercel)

on:
  push:
    branches: ['**']
  delete:

# Force-pushes to the mirror must not race each other.
concurrency:
  group: mirror-to-personal
  cancel-in-progress: false

jobs:
  mirror:
    # The mirror receives .github/ too, so without this guard the mirror repo
    # runs this workflow against itself and fails on the missing MIRROR_PAT.
    if: github.repository == 'kernel-science/physlib-website'
    runs-on: ubuntu-latest
    steps:
      # Vercel's Hobby plan refuses to build any commit whose *author* is not the
      # account owner, so the mirror is rewritten to list the owner as the author
      # of every commit. The canonical repo keeps real authorship; the mirror is
      # only a deploy artifact.
      - name: Mirror with rewritten authorship
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          AUTHOR_NAME: Gabriele Battimelli
          AUTHOR_EMAIL: info@gabrielebattimelli.com
        run: |
          set -euo pipefail

          git clone --quiet --mirror \
            "https://github.com/${GITHUB_REPOSITORY}.git" work.git
          cd work.git

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --env-filter '
              export GIT_AUTHOR_NAME="$AUTHOR_NAME"
              export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
              export GIT_COMMITTER_NAME="$AUTHOR_NAME"
              export GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"
            ' \
            --tag-name-filter cat -- --branches --tags

          # Explicit refspecs keep filter-branch's refs/original/* backups out of
          # the mirror; --prune propagates branch and tag deletions.
          git push --force --prune \
            "https://x-access-token:${MIRROR_PAT}@github.com/Gabrielebattimelli/Physlib-Website.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
